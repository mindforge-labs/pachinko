services:
  pachinko:
    build:
      context: .
      dockerfile: Dockerfile
    image: pachinko-stack-builder:local
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_FORCE: ${GEMINI_MODEL_FORCE:-}
      GEMINI_MODEL_DEFAULT: ${GEMINI_MODEL_DEFAULT:-gemini-3.5-flash}
      GEMINI_MODEL_POWERFUL: ${GEMINI_MODEL_POWERFUL:-gemini-3.1-pro-preview}
      GEMINI_MODEL_ECONOMICAL: ${GEMINI_MODEL_ECONOMICAL:-gemini-3.1-flash-lite}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
